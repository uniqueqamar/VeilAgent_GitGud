<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vision Test held_out_006</title>
  <style>
    body { font: 14px system-ui; max-width: 800px; margin: 20px auto; }
    .media-card { margin-bottom: 20px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .bg-container { width: 480px; height: 290px; background-image: url('../vision_data/ids/bank_statement_darkmode.png'); background-size: cover; }
  </style>
</head>
<body>
  <h2>Vision Privacy Verification Page: held_out_006</h2>
  <p>Mode: canvas_draw</p>

  <div class="media-card">
    <h3>Canvas Rendered ID</h3>
    <canvas id="canvas_id" width="500" height="310"></canvas>
    <script>
      const c = document.getElementById('canvas_id');
      const ctx = c.getContext('2d');
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0);
      img.src = '../vision_data/ids/bank_statement_darkmode.png';
    </script>
  </div>
  <div class="media-card">
    <h3>Harmless Graphic</h3>
    <img src="../vision_data/hard_negatives/neg_circuit_diagram.png">
  </div>

</body>
</html>
