<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nested Iframes Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    iframe { border: 2px solid #3b82f6; margin: 10px 0; display: block; }
  </style>
</head>
<body>
  <h1>Parent Top Frame</h1>
  <p>Top level content</p>
  <label for="top-name">Full name</label>
  <input type="text" id="top-name" name="top_name">
  <button id="top-btn">Submit Top</button>

  <!-- Same-origin nested iframe (Depth 1) -->
  <iframe id="iframe-same-origin" srcdoc="
    <html>
      <head><title>Same Origin Frame Depth 1</title></head>
      <body>
        <h2>Same-Origin Subframe Depth 1</h2>
        <input type='text' id='frame1-input' name='frame1_text' placeholder='Frame 1 Text'>
        <button id='frame1-btn'>Frame 1 Action</button>
        <!-- Nested iframe (Depth 2) -->
        <iframe id='iframe-depth-2' srcdoc=&quot;
          <html>
            <head><title>Frame Depth 2</title></head>
            <body>
              <h3>Nested Depth 2</h3>
              <input type='text' id='depth2-input' placeholder='Depth 2 Input'>
              <!-- Nested iframe (Depth 3) -->
              <iframe id='iframe-depth-3' srcdoc=&apos;
                <html>
                  <head><title>Frame Depth 3</title></head>
                  <body>
                    <h4>Nested Depth 3</h4>
                    <button id=&apos;depth3-btn&apos;>Depth 3 Button</button>
                    <!-- Nested iframe (Depth 4 - Exceeds max depth 3) -->
                    <iframe id=&apos;iframe-depth-4&apos; srcdoc=&apos;<html><body><h5>Too Deep 4</h5><button id=&quot;depth4-btn&quot;>Ignored</button></body></html>&apos;></iframe>
                  </body>
                </html>
              &apos;></iframe>
            </body>
          </html>
        &quot;></iframe>
      </body>
    </html>
  " width="500" height="400"></iframe>

  <!-- Simulated Cross-Origin iframe -->
  <iframe id="iframe-cross-origin" src="http://127.0.0.1:8001/checkout.html" width="450" height="200"></iframe>
</body>
</html>
