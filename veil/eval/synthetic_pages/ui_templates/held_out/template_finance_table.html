<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settlement Ledger & Transactions</title>
<style>
  :root {
    --bg: #fffbf5;
    --text: #332d29;
    --border: #e6dfd5;
    --primary: #854d0e;
    --card: #ffffff;
  }
  body.dark-theme {
    --bg: #1c1917;
    --text: #f5f5f4;
    --border: #292524;
    --primary: #ca8a04;
    --card: #292524;
  }
  body {
    margin: 0;
    padding: 30px;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, serif;
  }
  .header {
    border-bottom: 2px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
  }
  th, td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }
  th { font-family: sans-serif; font-size: 13px; text-transform: uppercase; background: rgba(0,0,0,0.03); }
  button {
    font-family: sans-serif;
    padding: 8px 16px;
    border-radius: 4px;
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
  }
  input[type="text"], select {
    font-family: sans-serif;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--card);
    color: var(--text);
  }
  .link-receipt {
    color: var(--primary);
    text-decoration: underline;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="header">
  <div>
    <h2 style="margin:0;">Escrow & Merchant Ledger</h2>
    <span style="font-size:13px; font-family:sans-serif; opacity:0.8;">Audited Settlement Cycle 2026-Q3</span>
  </div>
  <div style="display:flex; gap:12px;">
    <input type="text" id="txn-search" placeholder="Search reference...">
    <select id="currency-select">
      <option value="INR">INR (₹)</option>
      <option value="USD">USD ($)</option>
      <option value="EUR">EUR (€)</option>
    </select>
    <button id="btn-download-statement">Download Ledger</button>
  </div>
</div>

<table id="finance-table">
  <thead>
    <tr>
      <th>Ref Number</th>
      <th>Recipient Hash</th>
      <th>Amount</th>
      <th>Status</th>
      <th>Receipt</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>TXN-90211</td>
      <td>MERCH-V491</td>
      <td>₹12,450.00</td>
      <td>Settled</td>
      <td><a href="#rec1" class="link-receipt" id="link-rec-1">View Receipt</a></td>
    </tr>
    <tr>
      <td>TXN-90212</td>
      <td>MERCH-V492</td>
      <td>₹8,300.00</td>
      <td>Processing</td>
      <td><a href="#rec2" class="link-receipt" id="link-rec-2">View Receipt</a></td>
    </tr>
    <tr>
      <td>TXN-90213</td>
      <td>MERCH-V493</td>
      <td>₹45,000.00</td>
      <td>Settled</td>
      <td><a href="#rec3" class="link-receipt" id="link-rec-3">View Receipt</a></td>
    </tr>
  </tbody>
</table>
</body>
</html>
