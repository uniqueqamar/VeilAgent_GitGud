<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cluster Telemetry Watchdog</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --border: #334155;
    --cyan: #06b6d4;
  }
  body.dark-theme {
    --bg: #030712;
    --card: #111827;
    --text: #f9fafb;
    --border: #1f2937;
    --cyan: #22d3ee;
  }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: monospace, monospace;
  }
  .grid-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .card-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .metric-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .metric-title { font-size: 12px; color: var(--cyan); margin-bottom: 8px; }
  .metric-val { font-size: 24px; font-weight: bold; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  th, td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    font-size: 13px;
  }
  th { background: rgba(0,0,0,0.3); }
  button {
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--cyan); color: #000; }
  input[type="text"] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: inherit;
  }
</style>
</head>
<body>
<div class="grid-header">
  <div>
    <h3 style="margin:0;">CLUSTER NODES & THREAT MONITOR</h3>
    <span style="font-size:12px; opacity:0.8;">Region: ap-south-1 (Mumbai)</span>
  </div>
  <div style="display:flex; gap:10px;">
    <input type="text" id="node-search" placeholder="Filter node ID...">
    <button id="btn-cluster-refresh">Reload Nodes</button>
    <button id="btn-drain" style="border-color:#f43f5e; color:#f43f5e;">Emergency Drain</button>
  </div>
</div>

<div class="card-grid">
  <div class="metric-box">
    <div class="metric-title">TOTAL AGENT THREADS</div>
    <div class="metric-val">128</div>
  </div>
  <div class="metric-box">
    <div class="metric-title">MEMORY SATURATION</div>
    <div class="metric-val">41.8%</div>
  </div>
  <div class="metric-box">
    <div class="metric-title">OCR TENSOR OPS/SEC</div>
    <div class="metric-val">840</div>
  </div>
  <div class="metric-box">
    <div class="metric-title">SECURITY STATUS</div>
    <div class="metric-val" style="color:#10b981;">HEALTHY</div>
  </div>
</div>

<table id="node-status-table">
  <thead>
    <tr>
      <th>Node ID</th>
      <th>Instance Type</th>
      <th>Active Tasks</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>node-sg-01</td>
      <td>c6g.2xlarge</td>
      <td>14 tasks</td>
      <td><span style="color:#10b981;">ONLINE</span></td>
      <td><button id="btn-reboot-01">Reboot</button></td>
    </tr>
    <tr>
      <td>node-sg-02</td>
      <td>c6g.2xlarge</td>
      <td>21 tasks</td>
      <td><span style="color:#10b981;">ONLINE</span></td>
      <td><button id="btn-reboot-02">Reboot</button></td>
    </tr>
  </tbody>
</table>
</body>
</html>
