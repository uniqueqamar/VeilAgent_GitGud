<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enterprise Support Dispatch</title>
<style>
  :root {
    --bg: #fafafa;
    --text: #171717;
    --card: #ffffff;
    --border: #e5e5e5;
    --accent: #059669;
  }
  body.dark-theme {
    --bg: #121212;
    --text: #f5f5f5;
    --card: #1e1e1e;
    --border: #2e2e2e;
    --accent: #10b981;
  }
  body {
    margin: 0;
    padding: 28px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .layout-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  input[type="text"], select, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-sizing: border-box;
    background: transparent;
    color: var(--text);
    font-size: 14px;
  }
  textarea { height: 90px; resize: vertical; }
  .priority-options {
    display: flex;
    gap: 12px;
  }
  .priority-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button {
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    border: none;
  }
  .btn-submit { background: var(--accent); color: white; }
  .btn-draft { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .faq-link {
    display: block;
    padding: 8px 0;
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    border-bottom: 1px dashed var(--border);
  }
</style>
</head>
<body>
<div class="layout-grid">
  <div class="card">
    <h2 style="margin:0 0 16px;">Create Incident Ticket</h2>
    <form id="support-ticket-form">
      <div class="field">
        <label for="ticket-subject">Incident Subject</label>
        <input type="text" id="ticket-subject" placeholder="Brief issue description">
      </div>
      <div class="field">
        <label for="ticket-category">Service Category</label>
        <select id="ticket-category">
          <option value="net">Network Gateway</option>
          <option value="auth">OAuth & Vault Resolution</option>
          <option value="redact">Vision Redactor</option>
        </select>
      </div>
      <div class="field">
        <label>Urgency Level</label>
        <div class="priority-options">
          <label class="priority-badge"><input type="radio" name="urgency" value="p1"> P1 Critical</label>
          <label class="priority-badge"><input type="radio" name="urgency" value="p2" checked> P2 High</label>
          <label class="priority-badge"><input type="radio" name="urgency" value="p3"> P3 Normal</label>
        </div>
      </div>
      <div class="field">
        <label for="ticket-details">Diagnostic Logs</label>
        <textarea id="ticket-details" placeholder="Describe symptoms or paste sanitized traces..."></textarea>
      </div>
      <div class="field">
        <label><input type="checkbox" id="attach-telemetry"> Include encrypted audit fingerprint</label>
      </div>
      <div style="display:flex; gap:12px;">
        <button type="button" class="btn-submit" id="btn-create-ticket">Dispatch Ticket</button>
        <button type="button" class="btn-draft" id="btn-save-draft">Save Draft</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3 style="margin:0 0 12px;">Helpful Runbooks</h3>
    <a href="#doc1" class="faq-link" id="link-doc-1">Resolving Redaction False Positives</a>
    <a href="#doc2" class="faq-link" id="link-doc-2">Network Gate Allowlist Reference</a>
    <a href="#doc3" class="faq-link" id="link-doc-3">Local Vault Passphrase Reset</a>
    <div style="margin-top:20px;">
      <label>Search Knowledge Base</label>
      <input type="text" id="kb-search" placeholder="Type keywords...">
    </div>
  </div>
</div>
</body>
</html>
