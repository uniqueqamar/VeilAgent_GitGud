<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canvas-Rendered Interactive Application</title>
<style>
  :root {
    --bg: #f3f4f6;
    --text: #111827;
    --card: #ffffff;
    --border: #d1d5db;
    --primary: #4338ca;
  }
  body.dark-theme {
    --bg: #111827;
    --text: #f9fafb;
    --card: #1f2937;
    --border: #374151;
    --primary: #6366f1;
  }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  .container {
    max-width: 840px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }
  .controls-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  #app-canvas {
    border: 2px solid var(--border);
    border-radius: 8px;
    display: block;
    cursor: pointer;
    background: #ffffff;
  }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
  }
  .btn-dom {
    background: var(--primary);
    color: white;
    border: none;
  }
  .log-box {
    margin-top: 16px;
    padding: 12px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: monospace;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="controls-bar">
    <div>
      <h2 style="margin:0;">Custom Canvas Embedded Application</h2>
      <p style="margin:4px 0 0; font-size:13px; opacity:0.8;">Canvas UI with zero DOM elements for internal buttons/inputs</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-dom" id="btn-dom-reset">DOM Reset Button</button>
    </div>
  </div>

  <!-- Interactive Canvas: Contains widgets rendered via Canvas 2D API (no DOM nodes!) -->
  <canvas id="app-canvas" width="760" height="340"></canvas>

  <div class="log-box" id="canvas-event-log">Canvas Events: Ready. Click any canvas widget above.</div>
</div>

<script>
  const canvas = document.getElementById('app-canvas');
  const ctx = canvas.getContext('2d');
  const logEl = document.getElementById('canvas-event-log');

  // Custom visual widgets inside canvas (no DOM tags!)
  const widgets = {
    submitBtn: { x: 50, y: 160, w: 180, h: 44, label: 'Canvas Submit Button', class: 'button', color: '#2563eb', textColor: '#ffffff' },
    cancelBtn: { x: 250, y: 160, w: 140, h: 44, label: 'Canvas Cancel', class: 'button', color: '#e2e8f0', textColor: '#1e293b' },
    searchBox: { x: 50, y: 80, w: 340, h: 40, label: 'Search Canvas Registry...', class: 'text_input', color: '#f8fafc', textColor: '#64748b' },
    statusCheckbox: { x: 50, y: 230, w: 24, h: 24, label: 'Opt-in Telemetry', class: 'checkbox', checked: true },
    infoTable: { x: 440, y: 80, w: 280, h: 180, label: 'Canvas Metric Grid', class: 'table' }
  };

  function renderCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background gradient
    const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    bgGrad.addColorStop(0, '#f8fafc');
    bgGrad.addColorStop(1, '#edf2f7');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Title label
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('Canvas Embedded Workspace', 50, 48);

    // 1. Search text input widget
    const sb = widgets.searchBox;
    ctx.fillStyle = sb.color;
    ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sb.x, sb.y, sb.w, sb.h);
    ctx.fillStyle = sb.textColor;
    ctx.font = '14px sans-serif';
    ctx.fillText(sb.label, sb.x + 12, sb.y + 25);

    // 2. Submit Button widget
    const btn = widgets.submitBtn;
    ctx.fillStyle = btn.color;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 6) : ctx.rect(btn.x, btn.y, btn.w, btn.h);
    ctx.fill();
    ctx.fillStyle = btn.textColor;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + 27);
    ctx.textAlign = 'left';

    // 3. Cancel Button widget
    const cbtn = widgets.cancelBtn;
    ctx.fillStyle = cbtn.color;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cbtn.x, cbtn.y, cbtn.w, cbtn.h, 6) : ctx.rect(cbtn.x, cbtn.y, cbtn.w, cbtn.h);
    ctx.fill();
    ctx.strokeStyle = '#cbd5e1';
    ctx.stroke();
    ctx.fillStyle = cbtn.textColor;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(cbtn.label, cbtn.x + cbtn.w / 2, cbtn.y + 27);
    ctx.textAlign = 'left';

    // 4. Checkbox widget
    const cb = widgets.statusCheckbox;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cb.x, cb.y, cb.w, cb.h);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.strokeRect(cb.x, cb.y, cb.w, cb.h);
    if (cb.checked) {
      ctx.fillStyle = '#2563eb';
      ctx.fillRect(cb.x + 4, cb.y + 4, cb.w - 8, cb.h - 8);
    }
    ctx.fillStyle = '#1e293b';
    ctx.font = '14px sans-serif';
    ctx.fillText(cb.label, cb.x + 36, cb.y + 18);

    // 5. Canvas Table widget
    const tbl = widgets.infoTable;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(tbl.x, tbl.y, tbl.w, tbl.h);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1;
    ctx.strokeRect(tbl.x, tbl.y, tbl.w, tbl.h);
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('Channel', tbl.x + 12, tbl.y + 24);
    ctx.fillText('Status', tbl.x + 160, tbl.y + 24);
    ctx.beginPath();
    ctx.moveTo(tbl.x, tbl.y + 36);
    ctx.lineTo(tbl.x + tbl.w, tbl.y + 36);
    ctx.stroke();
    ctx.font = '13px sans-serif';
    ctx.fillText('Vault WebCrypto', tbl.x + 12, tbl.y + 60);
    ctx.fillText('Active', tbl.x + 160, tbl.y + 60);
    ctx.fillText('Vision Redactor', tbl.x + 12, tbl.y + 90);
    ctx.fillText('Online', tbl.x + 160, tbl.y + 90);
  }

  renderCanvas();

  // Click handler listening for synthetic or real mouse clicks
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    let clickedWidget = null;
    for (const [name, w] of Object.entries(widgets)) {
      if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) {
        clickedWidget = { name, ...w };
        break;
      }
    }

    if (clickedWidget) {
      logEl.textContent = `Canvas Event: Clicked [${clickedWidget.name}] (${clickedWidget.label}) at (${Math.round(x)}, ${Math.round(y)})`;
      if (clickedWidget.name === 'statusCheckbox') {
        widgets.statusCheckbox.checked = !widgets.statusCheckbox.checked;
        renderCanvas();
      }
    } else {
      logEl.textContent = `Canvas Event: Clicked empty canvas space at (${Math.round(x)}, ${Math.round(y)})`;
    }
  });

  document.getElementById('btn-dom-reset').addEventListener('click', () => {
    widgets.statusCheckbox.checked = true;
    renderCanvas();
    logEl.textContent = 'Canvas Event: DOM Reset clicked.';
  });
</script>
</body>
</html>
