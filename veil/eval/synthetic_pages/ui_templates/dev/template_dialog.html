<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Security Configuration & Dialog</title>
<style>
  :root {
    --bg: #f1f5f9;
    --text: #0f172a;
    --modal-bg: #ffffff;
    --border: #cbd5e1;
    --primary: #dc2626;
  }
  body.dark-theme {
    --bg: #0b0f19;
    --text: #f8fafc;
    --modal-bg: #1e293b;
    --border: #334155;
    --primary: #ef4444;
  }
  body {
    margin: 0;
    padding: 32px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dialog-box {
    background: var(--modal-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 480px;
    padding: 24px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
  }
  .dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .close-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text);
    padding: 4px 8px;
  }
  .field {
    margin-bottom: 16px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 500;
  }
  input[type="text"] {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-sizing: border-box;
    background: transparent;
    color: var(--text);
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 24px;
  }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-confirm { background: var(--primary); color: white; border: none; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body>
<div class="background-page">
  <h2>Protected System Environment</h2>
  <button id="btn-open-modal">Show Security Dialog</button>
</div>

<div class="overlay" role="presentation">
  <div class="dialog-box" role="dialog" aria-labelledby="dialog-title">
    <div class="dialog-header">
      <h3 id="dialog-title" style="margin:0;">Revoke Access Token</h3>
      <button class="close-btn" id="btn-close-dialog" aria-label="Close Dialog">✕</button>
    </div>
    <p style="font-size:14px; opacity:0.8; margin-top:0;">
      Are you sure you want to permanently revoke the credentials for the selected service?
    </p>
    <div class="field">
      <label for="confirm-reason">Revocation Justification</label>
      <input type="text" id="confirm-reason" placeholder="e.g. Key rotation policy">
    </div>
    <div class="field">
      <label><input type="checkbox" id="notify-admins"> Notify workspace administrators</label>
    </div>
    <div class="actions">
      <button class="btn-cancel" id="btn-dialog-cancel">Dismiss</button>
      <button class="btn-confirm" id="btn-dialog-confirm">Revoke Token</button>
    </div>
  </div>
</div>
</body>
</html>
