<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Operations Analytics Console</title>
<style>
  :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #0f172a;
    --border: #e2e8f0;
    --primary: #0284c7;
    --sidebar-bg: #1e293b;
    --sidebar-text: #f8fafc;
  }
  body.dark-theme {
    --bg: #0b0f19;
    --card-bg: #111827;
    --text: #f9fafb;
    --border: #1f2937;
    --primary: #38bdf8;
    --sidebar-bg: #030712;
    --sidebar-text: #f9fafb;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 220px;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sidebar-brand {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
  }
  .nav-item.active {
    background: rgba(255,255,255,0.12);
    color: #ffffff;
    font-weight: 600;
  }
  .main-content {
    flex: 1;
    padding: 24px 32px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    width: 280px;
  }
  .search-box input {
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
    color: var(--text);
    width: 100%;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .kpi-label {
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .kpi-val {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .card-section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .chart-placeholder {
    width: 100%;
    height: 140px;
    background: linear-gradient(135deg, rgba(2,132,199,0.15) 0%, rgba(2,132,199,0.05) 100%);
    border: 1px dashed var(--primary);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 500;
  }
  .toolbar {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .icon-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M3 9h18"/></svg>
    <span>Veil Portal</span>
  </div>
  <a href="#overview" class="nav-item active" id="nav-overview">
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Dashboard
  </a>
  <a href="#traffic" class="nav-item" id="nav-traffic">
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Traffic Monitor
  </a>
  <a href="#settings" class="nav-item" id="nav-settings">
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Gate Config
  </a>
</div>

<div class="main-content">
  <div class="top-bar">
    <div class="search-box">
      <input type="text" id="query-input" placeholder="Search sessions or metrics...">
    </div>
    <div style="display:flex; gap:10px;">
      <button class="icon-btn" id="btn-refresh" aria-label="Refresh">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="btn-primary" id="btn-export">Export Report</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Active Protected Sessions</div>
      <div class="kpi-val" id="kpi-sessions">1,482</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">PII Interceptions (24h)</div>
      <div class="kpi-val" id="kpi-interceptions">28,940</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Avg Verification Latency</div>
      <div class="kpi-val" id="kpi-latency">42 ms</div>
    </div>
  </div>

  <div class="card-section">
    <h3 style="margin:0 0 16px;">Redaction & Vision Throughput</h3>
    <div class="chart-placeholder" role="img" aria-label="System Metrics Plot">
      <span>[ Realtime Throughput Chart Visual ]</span>
    </div>
    <div class="toolbar">
      <button class="btn-outline" id="btn-filter-24h">Last 24 Hours</button>
      <button class="btn-outline" id="btn-filter-7d">7 Days</button>
      <button class="btn-primary" id="btn-audit">Run Gate Audit</button>
    </div>
  </div>
</div>
</body>
</html>
