<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Registration & Settings</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a24;
    --card-bg: #f8fafc;
    --border: #cbd5e1;
    --primary: #2563eb;
    --primary-text: #ffffff;
    --input-bg: #ffffff;
  }
  body.dark-theme {
    --bg: #0f172a;
    --text: #f1f5f9;
    --card-bg: #1e293b;
    --border: #334155;
    --primary: #3b82f6;
    --primary-text: #ffffff;
    --input-bg: #0f172a;
  }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .logo {
    width: 48px;
    height: 48px;
    background: var(--primary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: bold;
  }
  .field {
    margin-bottom: 20px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    font-size: 14px;
  }
  input[type="text"], input[type="email"], select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--input-bg);
    color: var(--text);
    font-size: 14px;
    box-sizing: border-box;
  }
  .radio-group, .checkbox-group {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .radio-item, .check-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }
  button {
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    border: none;
  }
  .btn-primary {
    background: var(--primary);
    color: var(--primary-text);
  }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .nav-links {
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
  }
  .nav-links a {
    color: var(--primary);
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo" role="img" aria-label="Brand Logo">VL</div>
    <div>
      <h2 style="margin:0;">User Profile Registration</h2>
      <p style="margin:4px 0 0; font-size:13px; opacity:0.8;">Complete personal details for identity verification</p>
    </div>
  </div>

  <form id="reg-form" onsubmit="return false;">
    <div class="field">
      <label for="fullname">Full Legal Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="e.g. Maya Sharma">
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="name@domain.com">
    </div>

    <div class="field">
      <label for="region">Operational Jurisdiction</label>
      <select id="region" name="region">
        <option value="">Select country...</option>
        <option value="IN">India</option>
        <option value="US">United States</option>
        <option value="UK">United Kingdom</option>
        <option value="SG">Singapore</option>
      </select>
    </div>

    <div class="field">
      <label>Entity Category</label>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="entity" value="individual" checked> Individual</label>
        <label class="radio-item"><input type="radio" name="entity" value="corporate"> Corporate</label>
        <label class="radio-item"><input type="radio" name="entity" value="trust"> Trust/Society</label>
      </div>
    </div>

    <div class="field">
      <div class="checkbox-group">
        <label class="check-item"><input type="checkbox" id="terms" name="terms"> I agree to terms and privacy policies</label>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" id="btn-submit">Submit Application</button>
      <button type="button" class="btn-secondary" id="btn-cancel">Reset</button>
    </div>

    <div class="nav-links">
      <a href="#help" id="link-support">Need registration assistance?</a> | <a href="#faq" id="link-faq">Read KYC FAQ</a>
    </div>
  </form>
</div>
</body>
</html>
