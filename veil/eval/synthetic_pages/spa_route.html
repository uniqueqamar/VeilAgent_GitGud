<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic SPA Route Navigation</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    nav { background: #e2e8f0; padding: 10px; margin-bottom: 20px; border-radius: 6px; }
    .page { padding: 15px; border: 1px solid #cbd5e1; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Dynamic Single Page Application</h1>
  <nav id="persistent-nav">
    <a href="#/home" id="nav-home">Home</a> |
    <a href="#/profile" id="nav-profile">Profile</a>
  </nav>

  <div id="app-container" class="page">
    <!-- Rendered dynamically -->
  </div>

  <script>
    const app = document.getElementById('app-container');

    function renderRoute(route) {
      if (route === 'step1') {
        app.innerHTML = `
          <h2>Step 1: Contact Information</h2>
          <label for="step1-email">Email</label>
          <input type="email" id="step1-email" placeholder="user@example.com">
          <button id="next-btn" onclick="renderRoute('step2')">Next Step</button>
        `;
      } else if (route === 'step2') {
        app.innerHTML = `
          <h2>Step 2: Confirmation</h2>
          <label for="step2-confirm">Confirmation Code</label>
          <input type="text" id="step2-confirm" placeholder="123456">
          <button id="finish-btn">Finish</button>
        `;
      }
    }

    // Initial route
    renderRoute('step1');
  </script>
</body>
</html>
